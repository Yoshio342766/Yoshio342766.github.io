<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* 基本的なスタイル */
        body {
            font-family: Arial, sans-serif; /* フォントを指定 */
            max-width: 800px;               /* 最大幅を設定 */
            margin: 0 auto;                 /* 中央寄せ */
            padding: 20px;                  /* 内側の余白を追加 */
            line-height: 1.6;               /* 行間を少し広くする */
        }
        /* 見出しのスタイル */
        h1 {
            color: #333;                    /* 見出しの色を指定 */
            border-bottom: 2px solid #ccc;  /* 下線を追加 */
            padding-bottom: 10px;           /* 下の余白を追加 */
        }
        /* 段落のスタイル */
        p {
            margin-left: 30px;              /* 左右の余白を追加 */
        }
        /* セクションのスタイル */
        .section {
            margin: 20px 0;                 /* 上下の余白を追加 */
        }
        /* README表示エリアのスタイル */
        #readme-container {
            background-color: #f6f8fa;      /* 背景色を指定 */
            border: 1px solid #d0d7de;      /* 枠線を追加 */
            margin-top: 5px;        	    /* 上下の余白を少し追加 */
            border-radius: 6px;     	    /* 角を丸くする */
            padding-top: 5px;       	    /* 上下の余白を少し追加 */
            padding-left: 20px;     	    /* 左右の余白を追加 */ 
        }
    </style>

    <!-- 1. MarkdownをHTMLに変換するためのライブラリ（marked.js）を読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
 
</head>
<body>
    <h1>Welcome to My Website</h1>
    
    <div class="section">
        <h2>About</h2>
        <p id="current-date">ここに今日の日付を表示させます。</p>
    </div>

    <div class="section">
        <h2>Contact</h2>
        <p>連絡先はありません。</p>
    </div>

    <!-- READMEを表示させるセクション -->
    <div class="section">
        <h3>README</h3>
        <div id="readme-container">読み込み中...</div>
    </div>

    <script>
        // 今日の日付を表示する処理
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth() + 1; // 月は0から始まるため +1 する
        const day = today.getDate();
        const dateString = `今日は、${year}年${month}月${day}日 です。`;

        document.getElementById('current-date').textContent = dateString;

        // README.mdを読み込んで表示する処理
        fetch('README.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('README.mdの読み込みに失敗しました。');
                }
                return response.text();
            })
            .then(markdown => {
                // marked.jsを使ってMarkdownをHTMLに変換し、divの中に流し込む
                document.getElementById('readme-container').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                document.getElementById('readme-container').innerHTML = '読み込みエラーが発生しました。';
                console.error(error);
            });
    </script>
</body>
</html>
