<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置情報データベース検索</title>
    <!-- 分離したCSSファイルを読み込む -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>位置情報データベース検索</h1>
    
    <!-- 検索入力欄 -->
    <input type="text" id="searchBox" placeholder="キーワードを入力（日付、場所など）...">

    <!-- 件数表示 -->
    <div class="meta-info" id="metaInfo">データを読み込み中...</div>

    <!-- 結果表示テーブル -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>No</th> <!-- 先頭にNoを追加 -->
                    <th>日　付</th>
                    <th>場所・施設名</th>
                    <th>備　考</th>
                    <th>地　図</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <!-- JavaScriptで結果を挿入 -->
            </tbody>
        </table>
    </div>
</div>

<script src="search.js"></script>
</body>
</html>
