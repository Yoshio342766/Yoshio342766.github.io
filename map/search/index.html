<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSVデータ検索システム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 30px; color: #333; background-color: #f9f9f9; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; margin-bottom: 20px; }
        #searchBox { padding: 12px; width: 100%; max-width: 400px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .meta-info { margin: 15px 0; font-size: 14px; color: #666; }
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { border-collapse: collapse; width: 100%; min-width: 600px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; }
        th { background-color: #f5f5f5; font-weight: bold; position: sticky; top: 0; }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #f1f5f9; }
        .no-result { text-align: center; color: #999; padding: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1>商品データベース検索</h1>
    
    <!-- 検索入力欄 -->
    <input type="text" id="searchBox" placeholder="キーワードを入力（スペース区切りでAND検索）...">

    <!-- 件数表示 -->
    <div class="meta-info" id="metaInfo">データを読み込み中...</div>

    <!-- 結果表示テーブル -->
    <div class="table-wrapper">
        <table>
            <thead id="tableHead">
                <!-- JavaScriptでヘッダーを自動生成 -->
            </thead>
            <tbody id="resultBody">
                <!-- JavaScriptで結果を挿入 -->
            </tbody>
        </table>
    </div>
</div>

<script src="search.js"></script>
</body>
</html>
