<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu - Drive history</title>
    
    <!-- 背景画像を先読みして、初回表示時の白い画面を短くする -->
    <link rel="preload" href="image/index_background.webp" as="image" fetchpriority="high">

    <!-- Google web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    
    <!-- キャッシュ無効化のためのメタタグ -->
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="background-wrapper"></div>
    
    <div class="menu-container">
        <h1>ドライブの足跡</h1>
        <div class="button-group">
            <!-- onclickでウィンドウ制御関数を呼び出す -->
            <a href="treeview.html" 
               class="menu-button" 
               onclick="openWindow(event, 'treeview.html', 'mapWindow')">マップ（ピン）</a>
            <a href="search.html" 
               class="menu-button" 
               onclick="openWindow(event, 'search.html', 'searchWindow')">検索</a>
        </div>
    </div>

    <script>
        // ウィンドウを管理して重複オープンを防ぐ関数
        function openWindow(event, url, windowName) {
            // <a>タグ本来のリンク動作（デフォルトの挙動）をキャンセル
            event.preventDefault();

            // window.openの第3引数でウィンドウのオプションを指定することも可能（必要に応じて）
            let win = window.open(url, windowName);

            // ウィンドウが正常に開けた（または既存のウィンドウにフォーカスできた）場合
            if (win) {
                win.focus(); // すでに開いている場合は手前に持ってくる
            }
        }
    </script>
</body>
</html>
