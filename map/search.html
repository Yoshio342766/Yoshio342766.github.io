<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立ち寄りスポット 検索</title>

    <link rel="stylesheet" href="css/search.css">
</head>
<body>

<div class="container">
    <h1>立ち寄スポット 検索</h1>
    
    <!-- 検索と並び替えのコントロールエリア -->
    <div class="controls">
        <!-- 検索入力欄 -->
        <input type="text" id="searchBox" placeholder="検索キーワード">

        <!-- 日付並び替えラジオボタン -->
        <div class="sort-options">
            <span>日付表示順　：</span>
            <label><input type="radio" name="dateSort" value="desc" checked> 降順</label>
            <label><input type="radio" name="dateSort" value="asc"> 昇順</label>
        </div>
    </div>

    <!-- 件数表示 -->
    <div class="meta-info" id="metaInfo">データを読み込み中...</div>

    <!-- 結果表示テーブル -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>日　付</th>
                    <th>場所・施設名</th>
                    <th>備　考</th>
                    <th>地　図</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                <!-- JavaScriptで結果を挿入 -->
            </tbody>
        </table>
    </div>

    <!-- もっと見るボタン -->
    <div class="load-more-area">
        <button type="button" id="loadMoreBtn" class="load-more" hidden>もっと見る</button>
    </div>
</div>

<script src="js/search.js"></script>
</body>
</html>
